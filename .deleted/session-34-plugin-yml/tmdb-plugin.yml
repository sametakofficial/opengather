# TMDb Plugin - The Movie Database metadata provider
name: tmdb
version: 1.0.0
category: output
class_name: TMDbPlugin

# Depends on renamer for parsed info
depends_on:
  - renamer

# Expects renamer.parsed to be available
expects:
  - renamer.parsed

# Supports both movies and shows
categories:
  - movie
  - show

# NEW: Capability system (what this plugin can do)
capabilities:
  - metadata.movie
  - metadata.show
  - metadata.episode
  - validation.duration

# NEW: Data fields this plugin produces
provides:
  - movie
  - show
  - episode
  - season
  - extras
  - normalized
  - validation

# NEW: Events this plugin emits
hooks:
  - metadata.found
  - movie.matched
  - show.matched

# NEW: Configuration schema
config_schema:
  api_key:
    type: string
    required: true
    secret: true
    description: TMDb API key (v3)
  language:
    type: string
    default: en-US
    pattern: "^[a-z]{2}-[A-Z]{2}$"
  region:
    type: string
    default: TR
  extras:
    type: object
    properties:
      movie_credits:
        type: boolean
        default: false
      movie_images:
        type: boolean
        default: false

# Plugin-specific aliases
aliases:
  movie: "{{ self.movie }}"
  show: "{{ self.show }}"
  episode: "{{ self.episode }}"
  season: "{{ self.season }}"
  credits: "{{ self.credits }}"
  images: "{{ self.images }}"
