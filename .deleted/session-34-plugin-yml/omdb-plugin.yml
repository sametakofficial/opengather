# OMDb Plugin - Open Movie Database metadata provider
name: omdb
version: 1.0.0
category: output
class_name: OMDbPlugin

# Depends on renamer for parsed info
depends_on:
  - renamer

# Expects renamer.parsed to be available
expects:
  - renamer.parsed

# Supports movies and shows
categories:
  - movie
  - show

# Plugin-specific aliases
aliases:
  movie: "{{ self.movie }}"
  show: "{{ self.show }}"
  ratings: "{{ self.ratings }}"
