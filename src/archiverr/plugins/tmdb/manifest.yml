# TMDb Plugin - The Movie Database metadata provider
# Session 11 - Stage-based format

name: tmdb
version: 1.0.0
description: Fetches movie and TV show metadata from TMDb API
stage: data
class_name: TMDbPlugin
entry_point: client.py

# Requires parsed data from renamer
requires:
  - job.plugins.renamer.parsed

# Provides HTTP requests and state updates
provides:
  - http.request
  - state.update

trigger_rule: all_success
reactive: false

# Supported media types
categories:
  - movie
  - show

# Configuration schema with validation rules
config_schema:
  api_key:
    type: string
    required: true
    min_length: 10
    pattern: "^[a-zA-Z0-9_-]+$"
    not_contains: ['"', "'", " "]
    secret: true
    description: TMDb API key (v3) - alphanumeric, no quotes or spaces

  language:
    type: string
    pattern: "^[a-z]{2}-[A-Z]{2}$"
    default: en-US
    description: Language code (e.g., en-US, tr-TR)

  region:
    type: string
    pattern: "^[A-Z]{2}$"
    default: TR
    description: Region code (e.g., US, TR)

  include-raw:
    type: boolean
    default: false
    description: Include raw API response in output

  extras:
    type: dict
    description: Extra data to fetch (credits, images, etc.)
