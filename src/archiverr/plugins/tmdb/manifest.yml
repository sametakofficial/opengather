# TMDb Plugin - The Movie Database metadata provider
# Session 12 - Per-job mode with plugin data dependencies

name: tmdb
version: 1.0.0
description: Fetches movie and TV show metadata from TMDb API
run_mode: per_job
stage: data
class_name: TMDbPlugin
entry_point: client.py

# Requires parsed data from renamer (Session 17: plugin.{name}.* flat format)
requires:
  - plugin.renamer.parsed:success

provides:
  - http.request
  - state.update

# FS lock for static paths only (no variables allowed)
fs_lock: []

trigger_rule: all_success

# Supported media types (DEPRECATED — UI-summary only, superseded by `emits` below).
categories:
  - movie
  - show

# Data namespace contribution (S39 R15 §A3).
# NOTE: This block declares the POST-B1/B2 flat shape. Until B1 (normalizer
# refactor) and B2 (client.execute) land, runtime still writes the legacy
# nested `episode`/`season`/`validation` ana keys; resolver will return
# undefined for paths not yet written. Manifest is a contract about the
# target shape, not a historical snapshot.
emits:
  show:
    - title.primary
    - title.original
    - title.localized
    - identifiers.tmdb_id
    - identifiers.imdb_id
    - air_dates.first
    - air_dates.last
    - air_dates.year
    - status
    - runtime
    - overview
    - genres
    - ratings.tmdb.score
    - ratings.tmdb.votes
    - network.name
    - network.id
    - seasons.total
    - episodes.total
    - season_number
    - episode_number
    - episode_title
    - episode_overview
    - episode_air_date
    - images.poster
    - images.backdrop
    - people.cast
    - people.crew
    - keywords
    - videos
  movie:
    - title.primary
    - title.original
    - title.localized
    - identifiers.tmdb_id
    - identifiers.imdb_id
    - release.date
    - release.year
    - release.status
    - runtime
    - overview
    - genres
    - ratings.tmdb.score
    - ratings.tmdb.votes
    - financial.budget
    - financial.revenue
    - images.poster
    - images.backdrop
    - people.cast
    - people.crew
    - keywords
    - videos

# Configuration schema with validation rules
config_schema:
  api_key:
    type: string
    required: true
    min_length: 10
    pattern: "^[a-zA-Z0-9_-]+$"
    not_contains: ['"', "'", " "]
    secret: true
    description: TMDb API key (v3) - alphanumeric, no quotes or spaces

  language:
    type: string
    pattern: "^[a-z]{2}-[A-Z]{2}$"
    default: en-US
    description: Language code (e.g., en-US, tr-TR)

  region:
    type: string
    pattern: "^[A-Z]{2}$"
    default: TR
    description: Region code (e.g., US, TR)

  include-raw:
    type: boolean
    default: false
    description: Include raw API response in output

  extras:
    type: dict
    description: Extra data to fetch (credits, images, etc.)
