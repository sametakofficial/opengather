name: omdb
version: 1.0.0
description: Fetches movie and TV metadata from OMDb API (IMDb-based)
stage: data
run_mode: per_job
class_name: OMDbPlugin
entry_point: client.py
requires:
  - plugin.renamer.parsed:success
provides:
  - http.request
# Note: reads ffprobe.container.duration for optional validation (soft dependency)
trigger_rule: all_success
categories:
  - movie
  - show
