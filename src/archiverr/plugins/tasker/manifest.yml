# Tasker Plugin - Task execution plugin
# Session 12 - Per-job mode, output stage

name: tasker
version: 1.0.0
description: Executes output tasks (print, save, etc.) for each job
run_mode: per_job
stage: output
class_name: TaskerPlugin
entry_point: plugin.py

provides:
  - output.render

# Plugin data dependencies (wait for data stage)
requires:
  - plugin.tmdb.data:success
  - plugin.renamer.parsed:success

# FS lock for static paths only
fs_lock:
  - /srv/archive

trigger_rule: all_done

# Supported media types (all)
categories: []

# Configuration schema
# Run-scope safety flags (dry_run, hardlink, no_delete) are owned by
# options.* and surfaced via services.run_safety. They are NOT plugin
# config keys and do not appear here.
config_schema:
  tasks:
    type: list
    required: true
    description: List of tasks to execute
