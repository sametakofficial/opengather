# Tasker Plugin - Task execution plugin
# Session 12 - Per-job mode, output stage

name: tasker
version: 1.0.0
description: Executes output tasks (print, save, etc.) for each job
run_mode: per_job
stage: output
class_name: TaskerPlugin
entry_point: plugin.py

# Session 12: Plugin data dependencies (wait for data stage)
requires:
  - plugin.tmdb.data:success
  - plugin.renamer.data:success

# FS lock for static paths only
fs_lock:
  - /srv/archive

trigger_rule: all_done

# Supported media types (all)
categories: []

# Configuration schema
config_schema:
  provides:
    type: list
    description: List of provides with path constraints (e.g., fs.write:/srv/media)
    default: []

  tasks:
    type: list
    required: true
    description: List of tasks to execute

  dry_run:
    type: boolean
    default: true
    description: If true, don't actually write files
