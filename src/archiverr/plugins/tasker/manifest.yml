# Tasker Plugin - Task execution plugin
# Session 12 - Per-job mode, output stage

name: tasker
version: 1.0.0
description: Executes output tasks (print, save, etc.) for each job
run_mode: per_job
stage: output
class_name: TaskerPlugin
entry_point: plugin.py

provides:
  - output.render

# Plugin data dependencies (wait for data stage).
# Only renamer is truly required: tasker templates depend on parsed
# title/year. Metadata plugins (tmdb/omdb/tvdb/tvmaze) are OPTIONAL
# contributors — their fields are accessed via Jinja and gracefully
# render to "" when a plugin is not loaded or didn't succeed.
# (Session 38 A11 fix: previously listed plugin.tmdb.data:success which
# misled readers into thinking TMDB was mandatory; with trigger_rule
# all_done the gate already let tasker run, but the manifest's stated
# intent disagreed with actual behaviour.)
requires:
  - plugin.renamer.parsed:success

# FS lock for static paths only
fs_lock:
  - /srv/archive

trigger_rule: all_success

# Supported media types (all)
categories: []

# Configuration schema
# Run-scope safety flags (dry_run, hardlink, no_delete) are owned by
# options.* and surfaced via services.run_safety. They are NOT plugin
# config keys and do not appear here.
config_schema:
  tasks:
    type: list
    required: true
    description: List of tasks to execute
