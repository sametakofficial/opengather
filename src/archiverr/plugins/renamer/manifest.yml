# Renamer Plugin - Parses media file names
# Session 11 - Stage-based format

name: renamer
version: 1.0.0
description: Parses media file names to extract movie/show metadata
stage: parse
class_name: RenamerPlugin
entry_point: client.py

# No dependencies - runs first after input
requires: []

# Provides state update (parsed metadata)
provides:
  - state.update

trigger_rule: all_success

# Supports both movies and shows
categories:
  - movie
  - show

# Configuration schema
config_schema:
  media_type:
    type: string
    default: auto
    description: Media type detection (auto, movie, show)
