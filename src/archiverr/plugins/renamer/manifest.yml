# Renamer Plugin - Parses media file names
# Session 12 - Per-job mode, parse stage

name: renamer
version: 1.0.0
description: Parses media file names to extract movie/show metadata
run_mode: per_job
stage: parse
class_name: RenamerPlugin
entry_point: client.py

# No dependencies - runs first in parse stage
requires: []

# FS lock for static paths only
fs_lock: []

trigger_rule: all_success

# Supports both movies and shows
categories:
  - movie
  - show

# Configuration schema
config_schema:
  media_type:
    type: string
    default: auto
    description: Media type detection (auto, movie, show)
