# FFprobe Plugin - Media file technical analysis
# Session 11 - Stage-based format

name: ffprobe
version: 1.0.0
description: Extracts technical metadata (video, audio, container) from media files
stage: data
class_name: FFProbePlugin
entry_point: client.py

# No dependencies - can run in parallel with other data plugins
requires: []

run_mode: per_job

provides:
  - process.execute
  - state.update

trigger_rule: all_success

# Supports all media types
categories: []

# Configuration schema with validation rules
config_schema:
  timeout:
    type: integer
    min: 1
    max: 300
    default: 30
    description: FFprobe command timeout in seconds

  ffprobe_path:
    type: string
    default: ffprobe
    description: Path to ffprobe binary

  cache_enabled:
    type: boolean
    default: true
    description: Enable caching of ffprobe results
