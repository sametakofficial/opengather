# TVDb Plugin - The TV Database metadata provider
name: tvdb
version: 1.0.0
category: output
class_name: TVDbPlugin

# Depends on renamer for parsed info
depends_on:
  - renamer

# Expects renamer.parsed to be available
expects:
  - renamer.parsed

# Only supports shows
categories:
  - show

# Plugin-specific aliases
aliases:
  show: "{{ self.show }}"
  episode: "{{ self.episode }}"
  season: "{{ self.season }}"
  series: "{{ self.series }}"
