name: tvdb
version: 1.0.0
description: Fetches TV show metadata from TheTVDB API
stage: data
run_mode: per_job
class_name: TVDbPlugin
entry_point: client.py
requires:
  - plugin.renamer.parsed:success
provides:
  - http.request
# Note: reads ffprobe.container.duration for optional validation (soft dependency)
trigger_rule: all_success
categories:
  - show
