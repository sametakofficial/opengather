# Scanner Plugin - Input plugin for file discovery
# This is the YAML format (preferred over plugin.json)

name: scanner
version: 1.0.0
category: input
class_name: ScannerPlugin

# No dependencies for input plugins
depends_on: []

# No expects for input plugins (they provide initial data)
expects: []

# Media categories this plugin supports (empty = all)
categories: []

# Plugin-specific aliases (available in templates)
# These provide shortcuts to this plugin's output data
aliases:
  # Self reference - refers to this plugin's output in current match context
  input: "{{ self.input }}"
  category: "{{ self.category }}"
  virtual: "{{ self.virtual }}"
