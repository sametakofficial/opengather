# ============================================================================
# PLUGIN MANIFEST (Enhanced with Status Reporting)
# ============================================================================
manifest:
  # Immutable fields
  name: tmdb
  version: 1.0.0
  stage: data  # null | parse | data | output
  class_name: TMDbPlugin
  entry_point: client.py
  
  # Mutable fields
  requires:
    - plugin.renamer.data.parsed:exists  # ✅ NEW: Check existence
    - plugin.renamer.status.success:true  # ✅ NEW: Check status value
  fs_lock: [/srv/media]
  trigger_rule: all_success
  
  # Config schema
  config_schema:
    api_key:
      type: string
      required: true
  
  # ✅ NEW: Status reporting behavior
  status_reporting:
    auto_start: true  # System sets state=running automatically
    auto_complete: false  # Plugin must call updateStatus()
    timeout_ms: 30000  # If no status update, mark as failed

# ============================================================================
# PLUGIN SYSTEM (Simplified - 2 Layers)
# ============================================================================
plugin_system:
  layers:
    1_registry:  # ✅ MERGED: Discovery + Loading + Registry
      responsibility: Find, load, and organize plugins
      methods:
        - discover_manifests() -> List[Path]
        - load_plugin(manifest_path) -> Plugin
        - get_plugins_by_stage(stage) -> List[Plugin]
        - get_plugin_by_name(name) -> Plugin
      output: Organized plugin registry
    
    2_executor:  # ✅ MERGED: Plugin + Stage execution
      responsibility: Execute plugins with dependency resolution
      methods:
        - execute_plugin(plugin, job, services) -> None
        - execute_stage(stage, jobs, services) -> None
        - check_requirements(plugin, context) -> bool
      output: Execution results
  
  # ❌ REMOVED: PluginDiscovery (merged into Registry)
  # ❌ REMOVED: PluginLoader (merged into Registry)
  # ❌ REMOVED: StageExecutor (merged into Executor)

