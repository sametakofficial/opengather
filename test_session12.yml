# Session 12 Test Config
# Test basic plugin execution flow

options:
  debug: true
  dry_run: true
  
scanner:
  targets:
    - "/tmp/test_movies"
  allow_virtual_paths: true
  extensions: [mkv, mp4]

renamer:
  media_type: auto

tmdb:
  api_key: "${TMDB_API_KEY}"
  language: en-US
  region: US

tasker:
  dry_run: true
  tasks:
    - type: print
      template: "Test: {{ plugin.tmdb.data.movie.title }}"
