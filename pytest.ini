[pytest]
# Archiverr Test Configuration

# Test paths
testpaths = tests

# Python files to consider as tests
python_files = test_*.py

# Test functions/methods
python_functions = test_*

# Test classes
python_classes = Test*

# Add markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require API running)
    slow: Slow tests

# Async mode for pytest-asyncio
asyncio_mode = auto

# Default options
addopts = 
    -v
    --tb=short
    -ra

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
