run:
  id: run_{uuid8}
  status:
    state: pending | running | success | failed | partial | cancelled
    success: bool
    total_jobs: int
    completed: int
    failed: int
    plugins: {}
    started_at: ISO8601
    finished_at: ISO8601
    duration_ms: int
  config:
    options: {}
    aliases: {}
  plugins: {}

job:
  id: job_{run_id}_{index}
  index: int
  run_id: run_{uuid8}
  input:
    value: string
    data: {}
  output:
    values:
      - string
    data: {}
  status:
    state: pending | running | success | failed
    success: bool
    plugins:
      <plugin_name>:
        state: pending | running | completed | failed | skipped
        success: bool
        started_at: ISO8601
        finished_at: ISO8601
        duration_ms: int
        error: string | null
    started_at: ISO8601
    finished_at: ISO8601
    duration_ms: int
  plugins:
    <plugin_name>: {}

jobs:
  - <job>

# NOTE 2026-04-30: The previous `plugin` and `plugins` top-level shapes
# documented here did not match the runtime persistence shape and had no
# direct readers. Kept here only as the *MongoDB persistence projection*
# of plugin executions; see 06-mongodb.yml#plugins for the real schema
# (flat document with explicit plugin_name field, not nested by name).
# At runtime, in-memory plugin state lives on `job.plugins` and
# `job.status.plugins` (see above) -- not on a separate top-level object.

plugin_result:
  success: bool
  data: {}
  error: string | null
  started_at: ISO8601
  finished_at: ISO8601
  metadata:
    skipped: bool
    skip_reason: string
