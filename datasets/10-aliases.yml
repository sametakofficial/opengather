model: path-based-interpolation + dbt-scoped-vars
jinja: render-only (tasker tasks, template fields)
deprecated:
  - regex alias rewrite at config load
  - tasker-local shortcut remaps
  - top-level-only aliases

syntax:
  absolute: ${config.plugin.renamer.parsed.movie}
  relative_sibling: ${.field}
  relative_parent: ${..field}
  alias_lookup: ${alias:movie}
  env: ${env:TMDB_API_KEY}
  default: ${config.plugin.tmdb.language:-en-US}

scopes:
  root:
    defined_at: config.yml top-level
    key: aliases
    visible_in: all descendants
  subtree:
    defined_at: any mapping
    key: aliases
    visible_in: that mapping and its descendants
    shadows: outer aliases with same name
  manifest:
    defined_at: plugins/<name>/manifest.yml
    key: aliases
    visible_in: that manifest and its merged config branch
    cannot_access:
      - runtime job/plugin state
      - other plugins' manifest-local aliases

resolver_phases:
  1_yaml_include: resolve !include directives
  2_env_expand: resolve ${env:VAR} and ${VAR}
  3_structural_merge: merge manifest -> plugin config branch (3-layer)
  4_scoped_interpolation: resolve ${...} expressions with scope stack
  5_pydantic_validate: validate via PluginManifest / config schemas
  6_freeze: config is read-only from this point

resolver_rules:
  - interpolation is evaluated against the compiled config tree, not strings
  - cyclic references fail at phase 4 with explicit error
  - unresolved refs fail-fast (no silent empty string)
  - default syntax ${path:-fallback} is the only implicit fallback
  - aliases are data, not code; no jinja control flow in alias values

alias_value_shape:
  simple: <dotted.path>
  explicit: ${<dotted.path>}
  computed: ${<resolver>:<args>}

reserved_alias_names:
  - run
  - job
  - jobs
  - plugin
  - plugins
  - config
  - options
  - provides
  - events

config_sample:
  aliases:
    movie: ${config.plugin.renamer.parsed.movie}
    show: ${config.plugin.renamer.parsed.show}
    tmdb_movie: ${config.plugin.tmdb.data.movie}
  tmdb:
    api_key: ${env:TMDB_API_KEY}
    language: tr-TR
  tasker:
    aliases:
      title: ${movie.name}
    tasks:
      - name: save
        destination: "{{ title }} ({{ movie.year }}).mkv"

manifest_sample:
  name: tmdb
  stage: data
  aliases:
    parsed: ${config.plugin.renamer.parsed}
  requires:
    - ${alias:parsed}:success

runtime_template_context_rule:
  - render-time jinja only sees a frozen context built from the compiled config + current run/job state
  - no alias resolution happens at render time; all aliases are pre-compiled into the context
