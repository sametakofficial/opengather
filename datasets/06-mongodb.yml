runs:
  _id: ObjectId
  id: run_{uuid8}
  status:
    state: string
    success: bool
    total_jobs: int
    completed: int
    failed: int
    started_at: ISODate
    finished_at: ISODate
    duration_ms: int
    plugins: {}
  config:
    options: {}
    plugins: {}
    aliases: {}
    tasks: []
  plugins: {}
  created_at: ISODate
  updated_at: ISODate
  persistence_mode: full | degraded | off

jobs:
  _id: ObjectId
  id: job_{run_id}_{index}
  run_id: run_{uuid8}
  index: int
  input:
    value: string
    data: {}
  output:
    values: [string]
    data: {}
  status:
    state: string
    success: bool
    plugins: {}
    started_at: ISODate
    finished_at: ISODate
    duration_ms: int
  plugins: {}
  created_at: ISODate
  updated_at: ISODate

plugins:
  _id: ObjectId
  run_id: run_{uuid8}
  job_id: job_{run_id}_{index}
  job_index: int
  plugin_name: string
  stage: input | parse | data | output
  status:
    state: completed | failed | skipped
    success: bool
    started_at: ISODate
    finished_at: ISODate
    duration_ms: int
    error: string | null
  data: {}
  created_at: ISODate

recovery_collections:
  see: 11-recovery.yml
  adds:
    - plugin_executions   # implemented (pymongo_persistence.py:347-403)
    - checkpoints         # FUTURE-WORK: not implemented (no writers, no schema today)

indexes:
  runs:
    - {id: 1}
    - {created_at: -1}
  jobs:
    - {id: 1}
    - {run_id: 1, index: 1}
  plugins:
    - {run_id: 1, job_id: 1, plugin_name: 1}
    - {job_id: 1}

known_unwired:
  # Collections that exist conceptually but have no live writer today.
  # Listed here (not under top-level schema) so a casual reader does not
  # mistake them for canonical surfaces.
  diagnostics:
    reason: "DiagnosticsLogger never instantiated; api/v1/system/router.py reads an always-empty collection."
    decision: "Wire it OR delete the reader. AGENT.md §'no defensive try/catch around impossible paths'."
  plugin_docs:
    reason: "Removed in session 36 PASS 3; was zero-reader write amplification. plugins collection covers cross-job query."
    status: "deleted from PyMongoPersistence (commit bd3840b)"

backends:
  pymongo_persistence: PersistenceInterface
  null_persistence: PersistenceInterface

mode_contract:
  see: 11-recovery.yml#persistence_mode_contract

interface:
  # Source of truth: src/archiverr/infrastructure/database/interface.py
  - connect
  - disconnect
  - save_run
  - save_job
  - save_plugin
  - save_plugin_execution
  - get_run
  - get_jobs
  - get_job
  - get_plugins
  - get_plugin
  - get_unfinished_plugin_executions  # used by recovery scan in slim model
  - get_statistics
# REMOVED 2026-04-30 (not in PersistenceInterface today; future-work):
#   save_checkpoint            -- checkpoints collection unwired
#   get_checkpoints            -- ditto
#   claim_plugin_execution     -- 11-recovery.yml#out_of_scope (slim contract)
#   heartbeat_plugin_execution -- ditto
#   get_plugin_executions      -- exposed only as get_unfinished_plugin_executions
# REMOVED 2026-04-30 (S36 PASS 2/3, zero callers / write amplification):
#   save_plugin_result         -- ghost: never abstract, hasattr-guard sleeper
#   update_plugin_result       -- 0 production callers (state.update_plugin canonical)
#   save_plugin_data           -- 0 production callers (state.update_plugin canonical)
#   update_plugin_doc          -- plugin_docs collection dropped (zero readers)
#   get_plugin_doc             -- ditto
