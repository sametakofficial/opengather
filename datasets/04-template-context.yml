render_time_context:
  source: TemplateContextBuilder only
  forbidden_sources:
    - tasker local _build_context
    - plugin-specific context mutation

context_shape:
  run: run_state_projection
  job: job_state_projection
  jobs: [job_summary]
  plugin:
    <plugin_name>:
      status: plugin_status
      data: plugin_data
  config: frozen_config
  options: config.options
  events: event_bus_snapshot
# REMOVED 2026-04-30 (TemplateContextBuilder.build_job_context does not emit them):
#   plugins (top-level array)         -- use job.plugins or plugin.<name>.data
#   provides (registry snapshot)      -- ProvidesRegistry is plugin-DI only,
#                                        not exposed in render-time context
#   index (top-level)                 -- only job.index is emitted; tasker adds a
#                                        local `index` shortcut after build_job_context
#   <resolved_alias>: value           -- aliases stay under config.aliases; not
#                                        copied to context root

canonical_access_path:
  current_plugin_data: plugin.<name>.data
  current_plugin_status: plugin.<name>.status
  deprecated_shortcuts:
    - plugin.<name>            # (missing .data / .status)
    - context[<plugin_name>]   # top-level plugin-name shortcut

run_state_projection:
  id: string
  status:
    state: string
    success: bool
    total_jobs: int
    completed: int
    failed: int

job_state_projection:
  index: int
  id: string
  input:
    value: string
    data: {}
  output:
    values: [string]
    data: {}
  status:
    state: string
    success: bool
    executed: [string]
    failed: [string]
    skipped: [string]

alias_resolution:
  phase: config-load-time (see 10-aliases.yml)
  at_render_time: none
  rationale: aliases are pre-compiled into the config tree; jinja only sees final values

jinja_features_allowed:
  - expressions
  - if / elif / else
  - for loops
  - filters (built-in + whitelisted archiverr filters)
  - "{% set %}"
jinja_features_forbidden:
  - "{% include %}"
  - "{% import %}"
  - custom globals at render time (must be pre-compiled aliases)
# Note: there is no enforcement layer for forbidden features today;
# tasker uses a default Jinja Environment and forbidden features will
# fail at render time with the standard Jinja error rather than a
# pre-flight check.

custom_filters:
  registered_in: src/archiverr/plugins/tasker/plugin.py
  archiverr:
    - count       # registered (tasker/plugin.py:37)
  builtins_used:
    - truncate    # Jinja built-in
    - format      # Jinja built-in (registered as filter alias in tasker/plugin.py:36)
  # tojson is a Jinja built-in available without registration
  # `index` filter was previously documented but is NOT registered; removed 2026-04-30

pipeline:
  1_build_context: TemplateContextBuilder(job, run, all_jobs, events)
  2_aliases_accessible_via_config: aliases are pre-resolved in config and
    remain reachable at render time as `config.aliases.<name>`; they are
    NOT copied to context root today.
  3_jinja_render: Jinja2.Environment.from_string(template).render(context)
