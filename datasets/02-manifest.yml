manifest:
  name: string
  version: string
  description: string
  class_name: string
  entry_point: client.py

  stage: input | parse | data | output
  run_mode: per_run | per_job

  requires:
    - plugin.<name>.<field>:success
    - plugin.<name>.<field>:any
    - job.<field>
  provides:
    - <capability>
  trigger_rule: all_success | one_success | all_done | all_fail | none_fail

  categories:
    - movie
    - show
  # categories: DEPRECATED 2026-05-01 (S38 R15) — UI-summary-only, no
  # pipeline routing. Superseded by `emits` (below). To be removed in a
  # future sprint after web frontend stops consuming it. Keep declaring
  # for backward compatibility, but new plugins should rely on `emits`
  # for the data namespace contribution.

  emits:
    <category>:
      - <dotted.path>
      - <dotted.path>
  # emits: NEW 2026-05-01 (S38 R15) — opt-in data namespace contribution.
  # Plugin declares which paths it writes (via update_plugin) under each
  # category. Categories are plugin-defined (no core enum); the keys of
  # this dict become the namespace's first-level segments.
  # Example (tmdb):
  #   emits:
  #     show:
  #       - title.primary
  #       - identifiers.tmdb_id
  #       - identifiers.imdb_id
  #     movie:
  #       - title.primary
  #       - release.year
  # Consumed by:
  #   - DataResolver (state/data_resolver.py): longest-prefix priority
  #     resolution against `data_priority` config; only plugins listed
  #     in their emits for a path participate in the resolver namespace.
  #   - template_dependency_validator (core/render/...): parse-time WARN
  #     when config.yml template references plugin.X but X is not in
  #     manifest.requires.
  # Optional: leaving emits unset (None) opts out of the data namespace
  # entirely; plugin still works, but `data.<cat>.<path>` cannot resolve
  # to it. Direct access via `jobs[job_id].plugins.<name>...` always works.

  fs_lock:
    - <absolute_path>
  # fs_lock: validated by core/locking/{manager,validator}.py for static-path
  # conflict detection at startup. There is NO runtime lock acquire/release;
  # the field reserves the path conceptually but does not gate execution.

  defaults:
    <config_field>: <value>

  # REMOVED 2026-04-30 (zero runtime readers, dead schema):
  #   capabilities: list[str]
  #   hooks: list[str]
  #   listens_to: list[str]
  #   reactive: bool
  # These were added in Session 34 (commit 5c24b22) as scaffolding for a
  # reactive plugin model that was never wired. They remain in the Pydantic
  # PluginManifest (manifest.py:27,33,36,37) with empty defaults but no
  # code path reads them. Drop from datasets to avoid misleading future readers.

  # aliases (manifest-level): NOT IMPLEMENTED.
  # PluginManifest schema does not declare an `aliases` field; Pydantic
  # extra=ignore drops it silently. Config-level aliases (subtree scopes)
  # work; manifest-level scope is documented in 10-aliases.yml#scopes.manifest
  # but is currently a known divergence (see datasets/README.yml).

  config_schema:
    <field>:
      type: string | integer | boolean | array | dict | object
      required: bool
      default: any
      min_length: int
      max_length: int
      pattern: regex
      not_contains: [string]
      secret: bool
      description: string

three_layer_merge:
  key_scheme:
    _manifest: meta+schema read from manifest.yml
    _defaults: manifest.defaults block
    user: config.yml plugin branch (authoritative)
    _resolved: final compiled config
  precedence:
    - user > _defaults > _manifest.config_schema.default
  merge_rules:
    - user values win; defaults never override user
    - _manifest is read-only; never overridden; consumable via ${plugin.<name>._manifest.*}
    - _resolved is computed once per run, then frozen

required_fields:
  - name
  - stage
  - run_mode
  - class_name
  - entry_point

forbidden_defaults:
  - stage         # must be explicit; missing -> ValueError (manifest.py:49-55)
  - run_mode      # must be explicit; missing -> ValueError (manifest.py:56-60)
# Note: trigger_rule has an implicit default of "all_success" in
# PluginManifest (manifest.py:26). Treat that as opt-in default, not
# forbidden. Plugins should still declare it explicitly when meaningful.

template_support:
  new_model:
    see: 10-aliases.yml
  allowed_expressions:
    - "${env:VAR}"
    - "${config.<path>}"
    - "${alias:<name>}"
    - "${..field}"
  # deprecated_fields.requires_only_jinja_render: removed 2026-04-30,
  # could not be located in any active or .deleted/ source.

discovery_extras:
  _path: string
  _manifest_type: string
  _validated: bool
# _resolved_at removed 2026-04-30: zero readers/writers

requires_path_prefix_rule:
  - "<name>.<field>  -> plugin.<name>.<field>"
  - "job.<field>     -> job.<field>"
  - "plugin.<name>   -> plugin.<name>"
