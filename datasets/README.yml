index:
  00-enums.yml:              enum values - state, stage, run_mode, trigger_rule, media_category
  01-config.yml:             config.yml top-level structure and plugin configs
  02-manifest.yml:           plugin manifest.yml structure and 3-layer merge (user/defaults/meta/resolved)
  03-run-state.yml:          runtime state - run, job, jobs, plugin, plugins, plugin_result
  04-template-context.yml:   jinja2 template context and alias resolution (render-time)
  05-events.yml:             event bus events and payloads
  06-mongodb.yml:             mongodb collections and indexes
  07-plugin-io.yml:          per-plugin inputs and outputs
  08-services.yml:           plugin services contracts (state, events, logger, config, template, provides)
  09-api-fastapi.yml:        fastapi request/response shapes
  10-aliases.yml:            inline alias/interpolation model (v1 target)
  11-recovery.yml:           plugin_executions and checkpoints for run recovery (v1 target)
  12-safety.yml:             dry_run, no-delete, hardlink central semantics (v1 target)

status: v1-draft (post reality-check, post 2026-04-29 audit)

canonical_sources_of_truth:
  enums:
    state: src/archiverr/state/models.py            # StateEnum
    plugin_status_media_category_plugin_category: src/archiverr/core/plugins/sdk/types.py
  run_job: src/archiverr/state/models.py
  manifest: src/archiverr/core/plugins/sdk/manifest.py
  plugin_result: src/archiverr/core/plugins/sdk/result.py
  persistence: src/archiverr/infrastructure/database/interface.py
  events: src/archiverr/events/bus.py
  template_context: src/archiverr/state/template_context.py
  alias_resolver: src/archiverr/core/config/interpolator.py   # Interpolator class (was incorrectly pointing to .deleted/alias_resolver.py)
  config_loader: src/archiverr/utils/config_loader.py

contract_freeze_rules:
  - one shape per concept; divergent shapes in legacy code must be adapted, not persisted here
  - no comments in *.yml; reference code via canonical_sources_of_truth
  - examples live in AI/DATASETS.yml and FINAL_DATASETS.yml
  - when code disagrees with a dataset file, code is the bug, not the dataset

known_divergences_today:
  - JobState.plugins (data) vs JobState.status.plugins (status) - dual write surfaces; plugin contract unaffected but bookkeeping is duplicated
  - get_execution_order returns flat list, drops dependency-group info (was: stage-ordered)
  - manifest.aliases is not in PluginManifest schema; config-level subtree aliases work, manifest-scope was removed from 10-aliases.yml on 2026-04-30
  - jinja_features_forbidden has no enforcement layer; using {% include %} fails at render time, not at config load
  - audit.events_emitted (plugin.side_effect) and audit.mongodb_trace (side_effects field, checkpoints collection) are not implemented; PlannedOperation is in-process only

unverified_in_2026-04-30_audit:
  - 03-run-state.yml: run.status.plugins and run.plugins shapes (writers not located)
  - 05-events.yml: payload field sets for run.completed and plugin.completed (emitter exists, exact dict not inspected)
  - 06-mongodb.yml: indexes_additions.plugin_executions creation in _create_new_indexes
  - 07-plugin-io.yml: ffprobe / tvdb / omdb / tvmaze / tasker.tasks data shapes (per-field spot-check pending)
  - 09-api-fastapi.yml: api/v1/run/ vs api/v1/runs/ duplicate router schemas; canonical not declared
  - 10-aliases.yml: ${path:-fallback} default-syntax parsing in interpolator
  - 02-manifest.yml: requires_path_prefix_rule strict enforcement

closed_since_last_review:
  - ExecutionContext legacy fields (match_index, total_matches, api_response) - moved to .deleted/
  - manifest stage/run_mode PARSE default - now raises ValueError in manifest.py:49-61 (Session 34)
  - provides_registry silent fallback in PluginServices - now raises PluginError in plugin_services.py:209
  - build_orchestrator silent NullPersistence downgrade - resolved via persistence_mode contract (orchestrator.py:512-617)
  - tasker shutil.copy2 direct call - now routes via core.safety.safe_copy (tasker/plugin.py:18,198)
  - hardlink option not consumed by tasker - now threaded through tasks (tasker/plugin.py:52,200)
  - dry_run dual surface - single authority via resolve_run_safety (orchestrator.py:100); per-plugin override forbidden
  - plugin.<name>.data canonical surface moved from tasker into TemplateContextBuilder (2026-04-30)

dead_schema_removed_2026-04-30:
  - 02-manifest.yml: capabilities, hooks, listens_to, reactive (Pydantic-only, zero readers)
  - 02-manifest.yml: discovery_extras._resolved_at (zero readers/writers)
  - 02-manifest.yml: template_support.deprecated_fields.requires_only_jinja_render (no source)
  - 01-config.yml: scanner.min_size_bytes (zero readers)
  - 01-config.yml: tmdb.include_raw_data (zero readers)
  - 04-template-context.yml: context_shape.plugins, provides, index, <resolved_alias> (not emitted by builder)
  - 04-template-context.yml: custom_filters.tojson (Jinja built-in, not custom), index (not registered)
  - 05-events.yml: run.failed, job.started, plugin.started, plugin.progress, task.{started,completed,failed}, state.changed, db.{connected,disconnected,synced,error} (zero emitters)
  - 06-mongodb.yml: interface.{save_checkpoint, get_checkpoints, claim_plugin_execution, heartbeat_plugin_execution} (future-work, unwired); get_plugin_executions renamed to get_unfinished_plugin_executions
  - 07-plugin-io.yml: renamer.confidence, tasker.tasks_executed, tasker.tasks_skipped, tasker.output_files (zero readers/writers)
  - 08-services.yml: EventService.emit, EventService.subscribe (read-only contract for plugins); legacy_per_job execute(match_data) (Session 34 deletion); lifecycle.setup, lifecycle.teardown (not in BasePlugin)
  - 10-aliases.yml: scopes.manifest, manifest_sample (PluginManifest schema does not accept aliases)
  - 12-safety.yml: audit.events_emitted (plugin.side_effect), audit.mongodb_trace (zero implementation)

v1_direction:
  - single path-based interpolation model (see 10-aliases.yml)
  - plugin 3-layer merge: _manifest / _defaults / user -> resolved (see 02-manifest.yml)
  - plugin_executions + checkpoints for recovery (see 11-recovery.yml)
  - central dry_run / no-delete / hardlink contract (see 12-safety.yml)
  - canonical template context only; drop tasker local context builder
