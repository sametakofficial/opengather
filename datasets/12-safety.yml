safety_contract:
  owned_by: core.safety service
  consumed_by:
    - all plugins that touch filesystem
    - all plugins that call external mutating APIs
  not_consumed_by:
    - pure data-fetch plugins (tmdb, tvdb, omdb, tvmaze)

dry_run:
  scope: run
  source: config.options.dry_run
  override_per_plugin: not allowed
  plugins_must:
    - skip side-effectful operation
    - still produce a planned_operation record in plugin data
    - log the skip at info level

no_delete:
  scope: run
  source: config.options.no_delete
  default: true
  forbidden_ops:
    - os.remove
    - os.rmdir
    - shutil.rmtree
    - pathlib.Path.unlink
    - pathlib.Path.rmdir
  allowed_alternative: move to .deleted/

hardlink:
  scope: run
  source: config.options.hardlink
  default: false
  fallback_if_unsupported:
    same_filesystem_unknown: copy
    cross_filesystem: copy
    readonly_source: copy
  when_true:
    - prefer os.link; fallback to copy with warning
  when_false:
    - always copy

planned_operation_record:
  op: copy | link | move | write | skip
  source: path | null
  target: path | null
  reason: string
  dry_run_only: bool

central_api:
  safe_copy: "(src, dst, *, hardlink: bool, dry_run: bool) -> PlannedOperation"
  safe_write: "(dst, content, *, dry_run: bool) -> PlannedOperation"
  safe_move: "(src, dst, *, dry_run: bool) -> PlannedOperation"
  safe_delete: "not exposed; callers must safe_move to .deleted/"

audit:
  # REMOVED 2026-04-30:
  #   events_emitted: plugin.side_effect -- zero emitters in active code.
  #   mongodb_trace:  plugin_executions.side_effects + checkpoints.side_effects
  #                   -- side_effects field is not written today; checkpoints
  #                   collection is unwired. See 11-recovery.yml#out_of_scope.
  # The PlannedOperation record returned by safe_copy/write/move is the
  # current "audit log". It is in-process only; no event bus emission and
  # no Mongo persistence of a side-effect trail today.
  planned_operation_in_process: PlannedOperation (see central_api)

