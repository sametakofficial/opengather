job_stages:
  - parse
  - data
  - output

execution_modes:
  per_run:
    stage: null
    access:
      - run
      - config
    cannot_access:
      - job
      - jobs
      - plugin
      - plugins
    methods:
      - createJob(input_value, input_data)
  per_job:
    stage: parse | data | output
    access:
      - run
      - config
      - job
      - jobs
      - plugin
      - plugins
    methods:
      - createJob(input_value, input_data)
      - updateJob(job_id, key, value)
      - updatePlugin(plugin_name, data)

trigger_rules:
  - all_success
  - one_success
  - all_done
  - all_fail
  - none_fail

global_state_structure:
  run:
    scope: entire run
    access: read-only
    example: run.total_jobs, run.status.state
  config:
    scope: frozen at startup
    access: read-only
    example: config.options.debug, config.tmdb.api_key
  job:
    scope: current job
    access: read-write for per_job
    example: job.input.value, job.output.values
  jobs:
    scope: all jobs
    access: read-only
    example: jobs[0].input.value
  plugin:
    scope: current job plugins
    access: read-write for per_job
    example: plugin.tmdb.movie.title
  plugins:
    scope: all jobs plugins
    access: read-only
    example: plugins[0].tmdb.movie

manifest:
  name: string
  version: string
  description: string
  run_mode: per_run | per_job
  stage: input | parse | data | output
  requires:
    - plugin.renamer.data.parsed:success
  fs_lock:
    - /downloads/movies
  trigger_rule: all_success
  class_name: string
  entry_point: client.py
  config_schema:
    api_key:
      type: string
      required: true
      secret: true
    language:
      type: string
      default: en-US

config_example:
  options:
    log_level: INFO
    debug: false
    dry_run: true
    hardlink: false
  aliases:
    movie: plugin.renamer.data.parsed.movie
    show: plugin.renamer.data.parsed.show
  scanner:
    enabled: true
    targets:
      - /downloads/movies
      - /downloads/shows
    recursive: true
    extensions: [mkv, mp4, avi]
    min_size_mb: 100
  renamer:
    enabled: true
    media_type: auto
  tmdb:
    enabled: true
    api_key: ${TMDB_API_KEY}
    language: tr-TR
    region: TR
    extras:
      movie_credits: true
      movie_images: true
      tv_credits: true
  tasker:
    enabled: true
    dry_run: true
    save_output: true
    output_dir: output
    tasks:
      - name: print_header
        type: print
        template: "========== JOB {{ index }} =========="
      - name: save_movie
        type: save
        condition: "{% if plugin.renamer.data.category == 'movie' %}true{% endif %}"
        template: "{{ plugin.tmdb.data.movie | tojson }}"
        destination: "{{ config.options.output_dir }}/{{ run.id }}_{{ job.index }}.json"

template_context:
  run: run state object
  job: current job state
  jobs: all jobs
  plugin: current job plugins
  plugins: all jobs plugins
  config: frozen config
  options: config.options
  index: current job index

