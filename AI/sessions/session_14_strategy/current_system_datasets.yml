# ============================================================================
# PLUGIN MANIFEST (Current Structure)
# ============================================================================
manifest:
  # Immutable fields
  name: tmdb
  version: 1.0.0
  run_mode: per_job
  stage: data
  class_name: TMDbPlugin
  entry_point: client.py

  # Mutable fields (config.yml override edebilir)
  requires:
    - plugin.renamer.data.parsed:success
  fs_lock: [] # GOOD: Static paths only
  trigger_rule: all_success

  # Config schema
  config_schema:
    api_key:
      type: string
      required: true

# ============================================================================
# PLUGIN DISCOVERY & LOADING (Current - 5 Layers!)
# ============================================================================
plugin_system:
  layers:
    1_discovery: # PluginDiscovery
      responsibility: Find manifest.yml files
      output: List[manifest_path]

    2_loader: # PluginLoader
      responsibility: Import Python modules
      output: List[PluginClass]

    3_registry: # PluginRegistry
      responsibility: Organize by stage
      output: Dict[Stage, List[Plugin]]

    4_executor: # PluginExecutor
      responsibility: Execute single plugin
      output: PluginResult

    5_stage_executor: # StageExecutor
      responsibility: Execute stage of plugins
      output: StageResult

  # ISSUE: Too many layers, mostly delegation
  # RECOMMENDATION: Merge 1+2 into 3 (Discovery + Loading into Registry)

# ============================================================================
# CONFIG PROCESSING (Current - 4 Steps)
# ============================================================================
config_processing:
  steps:
    1_load_yaml_with_includes:
      description: Process !include directives
      complexity: Medium
      status: GOOD (well-designed feature)

    2_expand_env_vars:
      description: Replace ${TMDB_API_KEY} with env values
      complexity: Low
      status: GOOD (essential)

    3_normalize_config:
      description: Support multiple config formats
      complexity: High
      status: QUESTIONABLE (3 formats support needed?)

    4_resolve_aliases:
      description: Replace m.title with plugin.tmdb.data.movie.title
      complexity: High (regex-based)
      status: GOOD (well-designed feature)

  # RECOMMENDATION: Keep 1, 2, 4. Review 3 (maybe support only 1 format?)

# ============================================================================
# ISSUES SUMMARY
# ============================================================================
issues:
  critical:
    - Legacy collections duplicate yazılıyor (executions, matches, plugin_results)
    - Commits oluşturuluyor ama hiç kullanılmıyor
    - MockPersistence hala kodda (KALDIRILACAK)

  state_management:
    - 6 state object (run, config, job, jobs, plugin, plugins)
    - Duplicate data tracking (job in _current_job and _jobs)
    - Gereksiz context tracking (current_job_id, current_plugin_name)

  access_control:
    - per_run plugin'ler jobs okuyamıyor (gereksiz kısıtlama)
    - per_job plugin'ler job oluşturamasın (gereksiz kısıtlama)
    - Plugin'ler global state'e direkt erişemiyor (gereksiz kısıtlama)

  plugin_tracking:
    - Sistem plugin success/fail tracking yapıyor
    - Plugin'ler kendi durumlarını bildirmeli (updateStatus)
    - executed/failed/skipped lists sistem tarafından yönetiliyor

  naming:
    - logger vs debugger karışıklığı
    - execution vs run (legacy aliases)
    - match vs job (legacy aliases)

# ============================================================================
# STRENGTHS (Keep These!)
# ============================================================================
strengths:
  - Stage-based execution (PARSE → DATA → OUTPUT)
  - Plugin system architecture (well-designed, not over-engineered)
  - Config merge with !include (well-designed)
  - Alias system (well-designed)
  - Env var expansion
  - Dependency-based execution (requires + trigger_rule)
  - Event bus (good design, just under-utilized)
