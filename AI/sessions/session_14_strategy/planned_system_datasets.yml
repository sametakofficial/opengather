        # ... plugin-specific data

  renamer:
    status:
      state: completed
      success: true
      duration_ms: 200
      message: "Parsed as movie"
    data:
      parsed:
        movie:
          name: Movie
          year: 2024

plugins:  # All jobs' plugins (normalized structure)
  - job_id: job_run_abc123_0
    job_index: 0
    plugin_data:  # ✅ Single nested object !# aferim ama hiç config.yml içinde plugins e erişecek olanları düşünme ama tamam mı ekle ekleyebildiğin kakdar katmankinaye yapıyorum şuan amacı sana bu kararını sorgulatmak yani plugin_data yaptın ne oldu ne değişi data yapsana ismini sadece bari daha kısa olsun
      tmdb:
        status: {...}
        data: {...}
      renamer:
        status: {...}
        data: {...}

# ============================================================================
# SIMPLIFIED GLOBAL STATE (3 Objects Instead of 6)
# ============================================================================
global_state:
  # ✅ SIMPLIFIED: 3 core objects only
  
  run:
    description: Current run metadata
    scope: Run-level
    access: Read-only for all plugins
    content: id, branch, status, timing
    
  config:
    description: Frozen configuration
    scope: Application-level
    access: Read-only for all plugins
    content: Merged config + manifest overrides + aliases
  !# beyendim aferim
  context:  # ✅ NEW: Unified execution context
    description: Current execution context
    scope: Job-level (when in job execution)
    access: Read-write for executing plugin
    content:
      job: Current job state
      jobs: All jobs (read-only)
      plugin: Current job's plugins
      plugins: All jobs' plugins (read-only)
  
  # ❌ REMOVED: Separate job, jobs, plugin, plugins objects
  # ✅ UNIFIED: Single context object with clear boundaries

# ============================================================================
# PLUGIN SERVICES (Simplified Access)
# ============================================================================
plugin_services:
  description: Unified interface for plugin-system communication
  
  # ✅ REMOVED: mode (per_run vs per_job) - irrelevant for plugins
  # ✅ REMOVED: current_job_id, current_plugin_name - internal tracking
  
  methods:
    # State access (no restrictions!)
    get_run:
      returns: RunState
      access: All plugins
    
    get_config: !# amınakoyayım neden kebab case kullanmadın da alt tire kullandın ya hepsini kebab case yap yada hepsini alt tire yap ne garipsin aq
      returns: Dict  
      access: All plugins
    
    get_context:
      returns: ExecutionContext
      access: All plugins
      description: "Returns current job context if in job execution"
    
    # State mutation
    createJob:
      params: [input_value, input_data]
      returns: job_id
      access: All plugins  # ✅ No restriction!
      description: "Any plugin can create jobs"
    
    updateJob:
      params: [job_id, key, value]
      returns: void
      access: All plugins  # ✅ No restriction!
      description: "Update any job (if you have job_id)"
    
    updatePlugin:
      params: [job_id, plugin_name, data]
      returns: void
      access: All plugins  # ✅ No restriction!
      description: "Update any plugin data"
    
    updateStatus:  # ✅ NEW: Plugin reports its own status
      params: [state, success, message, error]
      returns: void
      access: All plugins
      description: "Plugin reports its current status"
      example: |
        services.updateStatus(
          state="completed",
          success=True,
          message="Fetched 10 results"
        )
    
    # Event emission
    emit:
      params: [event_name, data]
      returns: void
      access: All plugins
      description: "Emit event to event bus"

# ============================================================================
# EXECUTION FLOW (Dependency-Based, Not Mode-Based)
# ============================================================================
# ✅ NEW PHILOSOPHY: Execution order determined by requires, not by mode
# ✅ Plugin declares what it needs (requires)
# ✅ System executes when dependencies satisfied

execution_flow:
  description: |
    System doesn't care about per_run vs per_job distinction.
    System only cares about: "Are this plugin's dependencies satisfied?"
  
  rules:
    - Plugin with no requires → Execute immediately (e.g., scanner)
    - Plugin with stage + requires → Wait for stage + dependencies
    - Plugin creates jobs → Other plugins wait for those jobs
    - Plugin reports status → Dependents can check that status  !# burda çok kritik birşeyi atlıyorsun abi bir plugin per job ise bir job olmadan execute edilemez yani bunu bir analoji ile anlatmak gerekirse kum saati düşün kum saatinde kum olmadan kum saatin dondursende birşey olmaz yani sistemimiz kum saati, her job da bir kum. yukarıda kum getiren bir boru var, o boruya bir modul kum veriyor kumu veren module nasıl bir kum vermesini tarif edende createJob yapan bir plugin(perrun per jıb farketmez) yani demek istediğim bu per run per job ayırt etmeme olayı hayata geçirilecek bir plan değil, eskisi iyiydi abi bazen zoelamamak gerek
  
  example_flow:
    scanner:
      requires: []  # No dependencies
      stage: null   # No stage (runs before stages)
      behavior: "Executes immediately, creates jobs"
    
    renamer:
      requires: []  # No dependencies within stage
      stage: parse
      behavior: "Executes for each job in parse stage"
    
    tmdb:
      requires:
        - plugin.renamer.data.parsed:exists  # ✅ Check data exists
        - plugin.renamer.status.success:true  # ✅ Check plugin succeeded
      stage: data
      behavior: "Executes after renamer completes successfully"
    
    tasker:
      requires:
        - plugin.tmdb.data.movie:exists
        - plugin.renamer.data.parsed:exists
      stage: output
      behavior: "Executes after both tmdb and renamer complete"
    
    # ✅ FLEXIBILITY: Plugin can create jobs during execution
    retry_failed:
      requires:
        - run.status.completed:true  # Wait for run to complete
      stage: output
      behavior: "Creates new jobs for failed items"
      example: |
        for job in services.get_context().jobs:
          if not job.status.success:
            services.createJob(job.input.value, {"retry": true})

