    # ❌ REMOVED: normalize_config (support only 1 format)
    # Decision: Pick the "new format" (plugins as top-level keys)
    # If users want old format, they manually convert once

# ============================================================================
# LOGGING (Standardized)
# ============================================================================
logging:
  description: Use Python's standard logging module
  
  # ❌ REMOVED: Custom Debugger class
  # ✅ REPLACED WITH: Python logging
  
  usage:
    import: import logging
    initialization: logger = logging.getLogger(__name__)
    methods:
      - logger.debug("message", extra={"key": "value"})
      - logger.info("message", extra={"key": "value"})
      - logger.warning("message", extra={"key": "value"})
      - logger.error("message", extra={"key": "value"})
  
  configuration:
    level: DEBUG | INFO | WARNING | ERROR
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    handlers:
      - console: StreamHandler(sys.stdout)
      - file: FileHandler("archiverr.log")

