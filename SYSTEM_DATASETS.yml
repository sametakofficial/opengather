    warn: '(message: str, **kwargs) -> None'
    error: '(message: str, **kwargs) -> None'
  ConfigService:
    get: '(key: str, default: any) -> any'
    get_plugin: '(plugin_name: str) -> dict'
    get_option: '(option: str, default: any) -> any'
  TemplateService:
    render: '(template: str, context: dict) -> str'
    build_context: '(job_id: str) -> dict'
  ProvidesService:
    complete: '(provide: str) -> None'
    is_completed: '(provide: str) -> bool'
    get_status: '(provide: str) -> dict'
  execution_modes:
    per_run:
      stage: null
      access:
      - run
      - config
      cannot_access:
      - job
      - jobs
      - plugin
      - plugins
      api:
      - create_job(input_value, input_data)
    per_job:
      stage: parse | data | output
      access:
      - run
      - config
      - job
      - jobs
      - plugin
      - plugins
      api:
      - create_job(input_value, input_data)
      - update_job(job_id, key, value)
      - update_plugin(plugin_name, data)
  plugin_contracts:
    per_run: execute_run(services) -> dict
    per_job: execute(job, services) -> PluginResult | dict
  base_classes:
  - BasePlugin (abstract)
  - InputPlugin (per_run)
  - OutputPlugin (per_job)
  lifecycle:
  - __init__(config)
  - execute_run(services) | execute(job, services)
api_fastapi:
  RunResponse:
    id: uuid4_string
    status:
      state: pending | running | success | failed | partial | cancelled
      success: bool
      total_jobs: int
      completed: int
      failed: int
      duration_ms: int
      error: string | null
    input:
      value: string
      data: {}
    output:
      values:
      - string
      data: {}
    jobs:
    - job_id
    config: {}
    options: {}
    created_at: ISO8601
    completed_at: ISO8601
  RunListResponse:
    items:
    - RunResponse
    total: int
    page: int
    page_size: int
  RunCreate:
    config: {}
    dry_run: bool
aliases:
  model: path-based-interpolation + dbt-scoped-vars
  jinja: render-only (tasker tasks, template fields)
  deprecated:
  - regex alias rewrite at config load
  - tasker-local shortcut remaps
  - top-level-only aliases
  syntax:
    absolute: ${config.plugin.renamer.parsed.movie}
    relative_sibling: ${.field}
    relative_parent: ${..field}
    alias_lookup: ${alias:movie}
    env: ${env:TMDB_API_KEY}
    default: ${config.plugin.tmdb.language:-en-US}
  scopes:
    root:
      defined_at: config.yml top-level
      key: aliases
      visible_in: all descendants
    subtree:
      defined_at: any mapping
      key: aliases
      visible_in: that mapping and its descendants
      shadows: outer aliases with same name
  resolver_phases:
    1_yaml_include: resolve !include directives
    2_env_expand: resolve ${env:VAR} and ${VAR}
    3_structural_merge: merge manifest -> plugin config branch (3-layer)
    4_scoped_interpolation: resolve ${...} expressions with scope stack
    5_pydantic_validate: validate via PluginManifest / config schemas
    6_freeze: 'config is read-only by convention from this point. Loader uses deepcopy

      boundaries; there is NO Pydantic frozen / immutable wrapper. Mutating

      config at runtime is undefined behaviour.

      '
  resolver_rules:
  - interpolation is evaluated against the compiled config tree, not strings
  - cyclic references fail at phase 4 with explicit error
  - unresolved refs fail-fast (no silent empty string)
  - default syntax ${path:-fallback} is the only implicit fallback
  - aliases are data, not code; no jinja control flow in alias values
  alias_value_shape:
    simple: <dotted.path>
    explicit: ${<dotted.path>}
    computed: ${<resolver>:<args>}
  reserved_alias_names:
  - run
  - job
  - jobs
  - plugin
  - plugins
  - config
  - options
  - provides
  - events
  config_sample:
    aliases:
      movie: ${config.plugin.renamer.parsed.movie}
      show: ${config.plugin.renamer.parsed.show}
      tmdb_movie: ${config.plugin.tmdb.data.movie}
    tmdb:
      api_key: ${env:TMDB_API_KEY}
      language: tr-TR
    tasker:
      aliases:
        title: ${movie.name}
      tasks:
      - name: save
        destination: '{{ title }} ({{ movie.year }}).mkv'
  runtime_template_context_rule:
  - render-time jinja only sees a frozen context built from the compiled config + current run/job state
  - no alias resolution happens at render time; all aliases are pre-compiled into the context
recovery:
  recovery_model: slim
  contract: "Single startup scan in persistence_mode=full marks any non-terminal\nplugin_execution row\
    \ (state in [started, running, claimed]) as\n'crashed'. There is no in-flight lease, no heartbeat,\
    \ no atomic\nclaim. The trade-off: a second concurrent orchestrator process\nagainst the same Mongo\
    \ deployment is undefined behaviour — at most\none orchestrator may run against a given persistence\
    \ backend at a\ntime.\n\nOut of scope for the slim contract (Session 36+):\n  - lease_expires_at /\
    \ heartbeat (5s interval, 30s lease)\n  - atomic findOneAndUpdate claim with state guard\n  - checkpoints\
    \ + idempotency_key for output plugins\nThese remain documented below as the future-work shape so\
    \ the\nslim recovery does not paint us into a corner; they are unwired.\n"
  collections_additions:
    plugin_executions:
      _id: ObjectId
      run_id: uuid4_string
      job_id: job_{run_id}_{index}
      plugin_name: string
      attempt: int
      state: started | running | completed | failed | crashed | skipped
      started_at: ISODate
      finished_at: ISODate
      duration_ms: int
      error: string | null
      claimed_at: ISODate | null
      lease_expires_at: ISODate | null
      idempotency_key: string | null
      output_fingerprint: string | null
    checkpoints:
      _id: ObjectId
      run_id: uuid4_string
      job_id: job_{run_id}_{index}
      plugin_name: string
      attempt: int
      marker: string
      side_effects:
      - type: fs.write | http.request | db.write
        target: string
        hash: string | null
        timestamp: ISODate
      created_at: ISODate
  indexes_additions:
    plugin_executions:
    - run_id: 1
      job_id: 1
      plugin_name: 1
      attempt: 1
    - state: 1
      finished_at: 1
    - state: 1
      lease_expires_at: 1
    - idempotency_key: 1
    checkpoints:
    - run_id: 1
      job_id: 1
      plugin_name: 1
  plugin_state_machine:
    started:
      enters_from: []
      exits_to:
      - running
      - crashed
      - skipped
    running:
      enters_from:
      - started
      exits_to:
      - completed
      - failed
      - crashed
    completed:
      enters_from:
      - running
      terminal: true
    failed:
      enters_from:
      - running
      terminal: true
    crashed:
      enters_from:
      - started
      - running
      terminal_for_attempt: true
      recoverable_via: new attempt (no automatic retry today)
    skipped:
      enters_from:
      - started
      terminal: true
  recovery_rules:
  - on orchestrator start (persistence_mode=full only), scan plugin_executions where state in (started,
    running, claimed) -> crashed
  - on persistence_mode=degraded, the startup scan is skipped; the run still proceeds
  - completed attempts are never re-run unless explicitly re-executed
  - failed attempts are not retried automatically; trigger_rule on dependent plugins decides skip
  persistence_mode_contract:
    full:
      backend: pymongo
      null_fallback: false
      on_connect_fail: raise CriticalError
      recovery: enabled (startup scan only, slim contract)
      on_query_fail_during_recovery: raise CriticalError
    degraded:
      backend: pymongo
      null_fallback: true
      on_connect_fail: log.warn (run continues without recovery bookkeeping)
      recovery: disabled
      on_query_fail_during_recovery: log.warn (best-effort)
    false:
      backend: null_persistence
      null_fallback: true
      recovery: disabled
  orchestrator_contract:
  - no silent NullPersistence downgrade; mode must be explicit (default: degraded)
  - persistence_mode=full + connect fail = fail-fast
  - persistence_mode=full + recovery query fail = fail-fast (durability promise)
  - _save_exec_state failures are warn-once-per-run + counter; do not crash the run
  failure_domains:
    business_failure:
      marker: state=failed
      recoverable: respects trigger_rule
    worker_crash:
      marker: state=crashed via startup scan
      recoverable: new attempt (manual today; auto-retry deferred)
    infrastructure_unavailable:
      marker: persistence.connect fail
      handled_by: persistence_mode_contract
  heartbeat_future_work:
    interval_ms: 5000
    lease_ms: 30000
    on_miss: lease expires; becomes crashed on next scan
safety:
  safety_contract:
    owned_by: core.safety service
    consumed_by:
    - all plugins that touch filesystem
    - all plugins that call external mutating APIs
    not_consumed_by:
    - pure data-fetch plugins (tmdb, tvdb, omdb, tvmaze)
  dry_run:
    scope: run
    source: config.options.dry_run
    override_per_plugin: not allowed
    plugins_must:
    - skip side-effectful operation
    - still produce a planned_operation record in plugin data
    - log the skip at info level
  no_delete:
    scope: run
    source: config.options.no_delete
    default: true
    forbidden_ops:
    - os.remove
    - os.rmdir
    - shutil.rmtree
    - pathlib.Path.unlink
    - pathlib.Path.rmdir
    allowed_alternative: move to .deleted/
  hardlink:
    scope: run
    source: config.options.hardlink
    default: false
    fallback_if_unsupported:
      same_filesystem_unknown: copy
      cross_filesystem: copy
      readonly_source: copy
    when_true:
    - prefer os.link; fallback to copy with warning
    when_false:
    - always copy
  planned_operation_record:
    op: copy | link | move | write | skip
    source: path | null
    target: path | null
    reason: string
    dry_run_only: bool
  central_api:
    safe_copy: '(src, dst, *, hardlink: bool, dry_run: bool) -> PlannedOperation'
    safe_write: '(dst, content, *, dry_run: bool) -> PlannedOperation'
    safe_move: '(src, dst, *, dry_run: bool) -> PlannedOperation'
    safe_delete: not exposed; callers must safe_move to .deleted/
  audit:
    planned_operation_in_process: PlannedOperation (see central_api)
  current_violations_to_fix: []
