execution_modes:
  per_job:
    description: her job icin bir kez calisir
    method: execute(self, job, services)
    examples:
      - renamer
      - tmdb
      - tasker
  per_run:
    description: tum run icin bir kez calisir
    method: execute_run(self, services)
    examples:
      - scanner
      - rclone
      - summary

memory_management:
  scope: plugins collection only
  reason: plugin data buyuk olabilir (100+ MB per job)
  strategy: hot_cold_tiering
  hot: RAM icindeki aktif plugin verileri
  cold: MongoDB deki persist edilmis veriler
  eviction: completed jobs first
  lazy_load: ihtiyac halinde MongoDB den yukle
