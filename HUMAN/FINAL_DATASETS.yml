stages:
  - input
  - parse
  - data
  - output

provides:
  fs:
    - fs.read
    - fs.write
    - fs.delete
    - fs.move
    - fs.copy
    - fs.hardlink
    - fs.symlink
    - fs.mkdir
    - fs.chmod
  http:
    - http.request
  job:
    - job.create
  state:
    - state.update
  process:
    - process.spawn
    - process.exec
  input:
    - input.value
    - input.data
  output:
    - output.values
    - output.data

lockable_provides:
  - fs.write
  - fs.delete
  - fs.move
  - fs.hardlink
  - fs.symlink

non_lockable_provides:
  - fs.read
  - fs.copy
  - fs.mkdir
  - fs.chmod
  - http.request
  - job.create
  - state.update
  - process.spawn
  - process.exec
  - input.value
  - input.data

trigger_rules:
  - all_success
  - one_success
  - all_done
  - all_fail
  - none_fail

default_aliases:
  system:
    run: run state
    job: current job state
    jobs: all jobs list
    plugins: all plugins for current job
    config: frozen config snapshot
    options: config.options shortcut
    provides: active provides registry
    events: event bus
  user: config.aliases

manifest_tmdb:
  name: tmdb
  version: 1.0.0
  description: TMDb metadata provider
  stage: data
  requires:
    - job.plugins.renamer.parsed
  provides:
    - http.request
    - state.update
  trigger_rule: all_success
  reactive: false
  class_name: TMDbPlugin
  entry_point: client.py
  config_schema:
    api_key:
      type: string
      required: true
    language:
      type: string
      default: en-US
    region:
      type: string
      default: US

manifest_scanner:
  name: scanner
  version: 1.0.0
  stage: input
  requires: []
  provides:
    - job.create
    - fs.read
    - input.value
    - input.data
  class_name: ScannerPlugin

manifest_renamer:
  name: renamer
  version: 1.0.0
  stage: parse
  requires: []
  provides:
    - state.update
  class_name: RenamerPlugin

manifest_tasker:
  name: tasker
  version: 1.0.0
  stage: output
  requires:
    - provides.state.update
  provides:
    - fs.write
    - output.values
    - output.data
    - state.update
  class_name: TaskerPlugin

config_example:
  options:
    debug: true
    dry_run: false
    force_conflicts: false
    memory:
      max_plugins_mb: 500
      flush_threshold: 0.8
      eviction_policy: completed_first
      lazy_cache_size: 10

  aliases:
    m: job.plugins.tmdb.movie
    s: job.plugins.tmdb.show
    p: job.plugins.renamer.parsed
    movie: job.plugins.renamer.parsed.movie
    show: job.plugins.renamer.parsed.show
    video: job.plugins.ffprobe.video
    audio: job.plugins.ffprobe.audio

  scanner:
    targets:
      - /downloads/movies
      - /downloads/shows
    recursive: true
    extensions:
      - mkv
      - mp4
      - avi
    min_size_mb: 100

  renamer:
    media_type: auto

  tmdb:
    api_key: ${TMDB_API_KEY}
    language: tr-TR
    region: TR
    include_adult: false

  tvdb: false

  ffprobe:
    timeout: 30
    cache_enabled: true

  tasker:
    provides:
      - fs.write:/srv/media
    tasks:
      - name: save_movie
        path: "{% if p.movie %}{{config.archive_path}}/{{m.title}} ({{m.release_date[:4]}})/{{m.title}}.mkv{% endif %}"
      - name: save_show
        path: "{% if p.show %}{{config.archive_path}}/{{s.name}}/Season {{p.show.season}}/{{s.name}} S{{p.show.season|pad(2)}}E{{p.show.episode|pad(2)}}.mkv{% endif %}"
      - name: log_result
        type: print
        template: "{{job.input.value}} -> {{job.output.values[0]}}"

config_include:
  scanner:
    targets:
      - /downloads

  tasker:
    tasks: "!include ./tasks/"

immutable_fields:
  - name
  - version
  - stage
  - class_name
  - entry_point

mutable_fields:
  - requires
  - provides
  - trigger_rule
  - reactive
  - config_schema

validation_phases:
  startup:
    - config_syntax
    - schema_validation
    - plugin_discovery
    - conflict_detection
    - dynamic_variable_check
  pre_execution:
    - requires_satisfaction
    - plugin_initialization

error_codes:
  E001: config file not found
  E002: yaml parse error
  E003: required field missing
  E010: invalid manifest
  E011: plugin class not found
  E012: plugin import failed
  E020: conflict detected
  E021: dynamic variable in provides
  W001: unknown field
  W002: parent-child path overlap
  W003: generic provides no path

provides_lock_syntax:
  generic: fs.write
  static: fs.write:/data/archive
  dynamic_example: fs.write:{{config.rclone.output_dir}}
  dynamic_invalid: fs.write:{{job.plugins.tmdb.movie.title}}

template_context:
  run: run state object
  job: current job state object
  jobs: all jobs in current run
  plugins: current job plugins data
  config: frozen config
  options: config.options
  provides: active provides
  events: event bus
  user_aliases: config.aliases

