name: ci

on:
  push:
    branches: [main, dev/communication-refactoring]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests/ -q --tb=short
      - name: Plugin-agnostic guard
        run: python -m pytest tests/unit/core/test_plugin_agnostic.py -q --tb=short
