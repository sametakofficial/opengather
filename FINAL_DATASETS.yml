# Session 12: Job stages (input stage removed, 3 stages remain)
job_stages:
  - parse   # Filename parsing, basic analysis - per_job plugins
  - data    # External data fetching (metadata, media info) - per_job plugins
  - output  # File operations, task execution - per_job plugins

# Session 12: Execution modes (plugin run_mode)
execution_modes:
  per_run:
    description: Run once per entire run, creates jobs
    stage: null
    access:
      - run (read-only)
      - config (read-only)
    cannot_access:
      - job (no current job context)
      - jobs (no jobs created yet)
      - plugin (no plugin context)
      - plugins (no plugin data yet)
    methods:
      - createJob(input_value, input_data) -> job_id
    examples: [scanner, config_loader]
  
  per_job:
    description: Run once per each job in stages
    stage: parse | data | output
    access:
      - run (read-only)
      - config (read-only)
      - job (read-write current job)
      - jobs (read-only all jobs)
      - plugin (read-write current job plugins)
      - plugins (read-only all jobs plugins)
    methods:
      - createJob(input_value, input_data) -> job_id
      - updateJob(job_id, key, value)
      - updatePlugin(plugin_name, data)
    examples: [renamer, tmdb, tasker]



trigger_rules:
  - all_success
  - one_success
  - all_done
  - all_fail
  - none_fail

global_state_structure:
  description: Six global state objects available in templates and trigger rules
  states:
    run:
      scope: entire run
      access: read-only for all plugins
      content: run metadata, status, timing
      example: run.total_jobs, run.status.state
    
    config:
      scope: frozen at startup
      access: read-only for all plugins
      content: merged config + manifest options
      example: config.options.debug, config.tmdb.api_key
    
    job:
      scope: current job being processed
      access: read-write for per_job plugins only
      access_denied: per_run plugins (no job context)
      content: input, output, status
      example: job.input.value, job.output.values
    
    jobs:
      scope: all jobs in this run
      access: read-only for per_job plugins
      access_denied: per_run plugins (jobs not created yet)
      content: array of all job states
      example: jobs[0].input.value, jobs[1].status.state
    
    plugin:
      scope: current job's all plugin data
      access: read-write for per_job plugins
      access_denied: per_run plugins (no plugin data yet)
      content: plugin_name -> plugin_data mapping
      example: plugin.tmdb.movie.title, plugin.renamer.parsed
    
    plugins:
      scope: all jobs' all plugin data
      access: read-only for per_job plugins
      access_denied: per_run plugins (no plugin data yet)
      content: array of {job_id, plugin_data} mappings
      example: plugins[0].tmdb.movie, plugins[1].renamer.parsed

# Session 12: Updated manifest examples
manifest_tmdb:
  name: tmdb
  version: 1.0.0
  description: TMDb metadata provider
  run_mode: per_job
  stage: data
  requires:
    - plugin.renamer.data.parsed:success    # Plugin success check
  fs_lock: []                                # ❌ Variables yasak, sadece static path
  trigger_rule: all_success
  class_name: TMDbPlugin
  entry_point: client.py
  config_schema:
    api_key:
      type: string
      required: true
    language:
      type: string
      default: en-US
    region:
      type: string
      default: US

manifest_scanner:
  name: scanner
  version: 1.0.0
  description: File discovery plugin
  run_mode: per_run
  requires: []
  fs_lock:
    - /downloads/movies
    - /downloads/shows
  trigger_rule: all_success
  class_name: ScannerPlugin

manifest_renamer:
  name: renamer
  version: 1.0.0
  description: Filename parser
  run_mode: per_job
  stage: parse
  requires: []
  fs_lock: []
  trigger_rule: all_success
  class_name: RenamerPlugin

manifest_tasker:
  name: tasker
  version: 1.0.0
  description: Output task executor
  run_mode: per_job
  stage: output
  requires:
    - plugin.tmdb.data:success              # Plugin data exists check
    - plugin.renamer.data:success           # Plugin data exists check
  fs_lock:
    - /srv/archive                          # ✅ Static path only, no variables
  trigger_rule: all_success
  class_name: TaskerPlugin



config_example:
  options:
    debug: true
    dry_run: false
    force_conflicts: false

  aliases:
    m: plugin.tmdb.data.movie
    s: plugin.tmdb.data.show
    p: plugin.renamer.data.parsed
    movie: plugin.renamer.data.parsed.movie
    show: plugin.renamer.data.parsed.show
    video: plugin.ffprobe.data.video
    audio: plugin.ffprobe.data.audio

  scanner:
    targets:
      - /downloads/movies
      - /downloads/shows
    recursive: true
    extensions:
      - mkv
      - mp4
      - avi
    min_size_mb: 100

  renamer:
    media_type: auto

  tmdb:
    api_key: ${TMDB_API_KEY}
    language: tr-TR
    region: TR
    include_adult: false

  tvdb: false

  ffprobe:
    timeout: 30
    cache_enabled: true

  tasker:
    fs_lock:
      - /srv/media
    tasks:
      - name: save_movie
        path: "{% if p.movie %}{{config.archive_path}}/{{m.title}} ({{m.release_date[:4]}})/{{m.title}}.mkv{% endif %}"
      - name: save_show
        path: "{% if p.show %}{{config.archive_path}}/{{s.name}}/Season {{p.show.season}}/{{s.name}} S{{p.show.season|pad(2)}}E{{p.show.episode|pad(2)}}.mkv{% endif %}"
      - name: log_result
        type: print
        template: "{{job.input.value}} -> {{job.output.values[0]}}"

config_include:
  scanner:
    targets:
      - /downloads

  tasker:
    tasks: "!include ./tasks/"

# Session 12: Value-based trigger rule examples
trigger_rule_examples:
  plugin_success_check:
    description: "Check if plugin data exists (success/fail only for plugins)"
    requires:
      - plugin.tmdb.data.movie:success        # ✅ Plugin için OK
      - plugin.renamer.data.parsed:success    # ✅ Plugin için OK
    trigger_rule: all_success
  
  primitive_value_check:
    description: "Exact value match for non-plugin states"
    requires:
      - run.total_jobs:10                     # ✅ int exact match
      - config.options.debug:true             # ✅ boolean exact match
      - job.input.value:"/path/to/file"      # ✅ string exact match
    trigger_rule: all_success
  
  mixed:
    description: "Mix plugin success/fail with primitive checks"
    requires:
      - plugin.renamer.data.parsed:success    # ✅ Plugin success check
      - run.total_jobs:10                     # ✅ Primitive value
      - config.options.debug:true             # ✅ Primitive value
    trigger_rule: all_success
  
  invalid_examples:
    description: "YASAK: Non-plugin paths için success/fail kullanılamaz"
    # ❌ run.status:success        → VALIDATION ERROR
    # ❌ job.output:success        → VALIDATION ERROR
    # ❌ config.tmdb:success       → VALIDATION ERROR
  


