# ============================================================
# Archiverr Configuration
# ============================================================

# Aliases - Define shortcuts for template access
# These can be used in task templates: {{ m.index }}, {{ g.status.matches }}
aliases:
  # Default shortcuts
  e: "execution"           # {{ e.id }}, {{ e.success }}
  m: "match"               # {{ m.index }}, {{ m.input_path }}
  g: "globals"             # {{ g.status.matches }}, {{ g.summary }}
  
  # Plugin shortcuts (current match context)
  movie: "renamer.parsed.movie"     # {{ movie.name }}, {{ movie.year }}
  show: "renamer.parsed.show"       # {{ show.name }}, {{ show.season }}
  
  # API shortcuts
  tmdb_movie: "tmdb.movie"          # {{ tmdb_movie.title }}
  tmdb_show: "tmdb.show"            # {{ tmdb_show.name }}

options:
  debug: true
  dry_run: true
  hardlink: true
plugins:
  ffprobe:
    enabled: true
    timeout: 15
  file-reader:
    allow_virtual_paths: true
    enabled: false
    targets:
    - /media/shows/Breaking Bad S01E01.mkv
  mock-test:
    enabled: false
  omdb:
    api_key: ${OMDB_API_KEY}
    enabled: true
    include-raw: true
  renamer:
    enabled: true
    media_type: auto
  scanner:
    enabled: true
    recursive: false
    targets:
    - /home/samet/torrents/Mr. & Mrs. Smith (2005) BluRay 1080p DDP5.1 H.265 TSRG.mkv
  tmdb:
    api_key: ${TMDB_API_KEY}
    enabled: true
    extras:
      movie_credits: true
      movie_images: true
      movie_keywords: true
      movie_videos: true
      tv_credits: true
      tv_episode_credits: true
      tv_episode_images: true
      tv_images: true
      tv_keywords: true
      tv_season_images: true
      tv_videos: true
    include-raw: true
    language: tr-TR
  tvdb:
    api_key: ${TVDB_API_KEY}
    enabled: true
    extras:
      episodes_extended: true
      movies_extended: true
      seasons_extended: true
      series_artworks: true
      series_extended: true
      tags_options: true
    include-raw: true
  tvmaze:
    enabled: true
    extras:
      episodes_guestcast: true
      episodes_guestcrew: true
      episodes_single: true
      shows_cast: true
      shows_crew: true
      shows_episodes: true
      shows_images: true
      shows_seasons: true
    include-raw: true
tasks:
- name: print_match_header
  template: '

    ========== MATCH {{ index }} ==========

    '
  type: print

# NEW: Alias test task
- name: alias_test
  type: print
  template: |
    --- Alias Test ---
    {{ m.index }}: {{ m.input_path | truncate(50) }}
    {% if movie %}Movie: {{ movie.name }} ({{ movie.year }}){% endif %}
    {% if show %}Show: {{ show.name }} S{{ '%02d' | format(show.season) }}E{{ '%02d' | format(show.episode) }}{% endif %}
    {% if tmdb_movie %}TMDb: {{ tmdb_movie.title.primary }}{% endif %}
    {% if tmdb_show %}TMDb Show: {{ tmdb_show.title.primary }}{% endif %}
    Globals: {{ g.status.matches }} matches
    --- End Alias ---

- name: print_input
  template: '{% if match_globals and match_globals.input %}Input: {{ match_globals.input.path
    }}{% if match_globals.input.virtual %} (virtual){% endif %} [{{ match_globals.input.category|upper
    }}]{% endif %}

    '
  type: print
- name: print_renamer
  template: '{% if renamer and renamer.category == ''movie'' %}MOVIE: {{ renamer.parsed.movie.name
    }} ({{ renamer.parsed.movie.year }}){% elif renamer and renamer.category == ''show''
    %}SHOW: {{ renamer.parsed.show.name }} S{{ ''%02d'' | format(renamer.parsed.show.season)
    }}E{{ ''%02d'' | format(renamer.parsed.show.episode) }}{% endif %}

    '
  type: print
- external: true

  name: detailed_metadata_check
  path: tasks/metadata-checker.yml
- external: true

  name: dump_api_response
  path: tasks/api-response-dump.yml
- condition: '{{ index: == (count:matches - 1) }}'
  name: print_summary
  template: '

    ============================================================

    ENDPOINT TEST SUMMARY

    ============================================================

    Total Matches: {{ globals.status.matches }}

    Success Rate: {{ globals.status.success }}

    ============================================================

    '
  type: print
