# Archiverr Configuration
# S39 R15 §C5: tasker templates rewritten to the new paradigm.
# Canonical access:
#   {{ jobs[job_id].plugins.<name>.<field> }}   (cross-job; full path)
#   {{ job.plugins.<name>.<field> }}            (current-job shortcut)
#   {{ data.<jobindex>.<category>.<path> }}     (resolver-priority — Phase D)
# Use ``${alias:name}`` in manifests for scoped interpolation — see
# ``core/config/interpolator.py``.

options:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  # DEBUG: Show everything (verbose)
  # INFO: Show INFO and above (default, recommended)
  # WARNING: Show only warnings and errors
  # ERROR: Show only errors
  log_level: DEBUG # Default: INFO

  # Legacy (use log_level instead):
  debug: false
  dry_run: true
  hardlink: true

# S40 — category-only priority. Scope (run vs job) comes from
# each plugin's manifest.run_mode. Do not put plugin names as keys.
data_priority:
  show: [tmdb, omdb, tvmaze, tvdb]
  show.episode_title: [tmdb]
  show.episode_overview: [tmdb]
  show.season_number: [tmdb]
  show.episode_number: [tmdb]
  movie: [tmdb, omdb, tvdb]

scanner:
  enabled: true
  targets:
    - "/tmp/Breaking.Bad.S01E01.720p.BluRay.x264.mkv"
  allow_virtual_paths: true
  extensions: [mkv, mp4, avi]
  recursive: false

ffprobe:
  enabled: true

renamer:
  enabled: true
  media_type: auto

tmdb:
  enabled: true
  api_key: "${TMDB_API_KEY}"
  language: tr-TR
  region: TR
  extras:
    movie_credits: true
    movie_images: true
    movie_keywords: true
    movie_videos: true
    tv_credits: true
    tv_episode_credits: true
    tv_episode_images: true
    tv_images: true
    tv_keywords: true
    tv_season_images: true
    tv_videos: true

tasker:
  enabled: true
  dry_run: true
  save_output: true
  output_dir: "output"
  tasks:
    # Header
    - name: print_header
      type: print
      template: |

        ========== JOB {{ job_index }} ==========

    # Input info
    - name: print_input
      type: print
      template: |
        Input: {{ job.input.value }}

    # Renamer output (S39 §C5: jobs[job_id].plugins.<name> paradigm)
    - name: print_renamer
      type: print
      template: |
        {% if jobs[job_id].plugins.renamer.parsed.movie %}MOVIE: {{ jobs[job_id].plugins.renamer.parsed.movie.name }} ({{ jobs[job_id].plugins.renamer.parsed.movie.year }}){% elif jobs[job_id].plugins.renamer.parsed.show %}SHOW: {{ jobs[job_id].plugins.renamer.parsed.show.name }} S{{ '%02d' | format(jobs[job_id].plugins.renamer.parsed.show.season) }}E{{ '%02d' | format(jobs[job_id].plugins.renamer.parsed.show.episode) }}{% endif %}

    # TMDb metadata (S39 §B1+B2: flat shape — episode info baked into show)
    - name: print_tmdb
      type: print
      template: |
        {% if jobs[job_id].plugins.tmdb.movie %}TMDb Movie: {{ jobs[job_id].plugins.tmdb.movie.title.primary }} ({{ jobs[job_id].plugins.tmdb.movie.release.year }})
        TMDb ID: {{ jobs[job_id].plugins.tmdb.movie.identifiers.tmdb_id }}
        Overview: {{ jobs[job_id].plugins.tmdb.movie.overview | truncate(100) }}{% elif jobs[job_id].plugins.tmdb.show %}TMDb Show: {{ jobs[job_id].plugins.tmdb.show.title.primary }} ({{ jobs[job_id].plugins.tmdb.show.air_dates.year }})
        TMDb ID: {{ jobs[job_id].plugins.tmdb.show.identifiers.tmdb_id }}{% if jobs[job_id].plugins.tmdb.show.episode_title %}
        Episode: S{{ '%02d' | format(jobs[job_id].plugins.tmdb.show.season_number) }}E{{ '%02d' | format(jobs[job_id].plugins.tmdb.show.episode_number) }} - {{ jobs[job_id].plugins.tmdb.show.episode_title }}
        Overview: {{ jobs[job_id].plugins.tmdb.show.episode_overview | truncate(100) }}{% endif %}{% endif %}

    # Test conditional rendering (S39 §C5: condition core-rendered to bool)
    - name: test_condition
      type: print
      condition: "{% if jobs[job_id].plugins.tmdb.movie.ratings.tmdb.score > 8 or jobs[job_id].plugins.tmdb.show.ratings.tmdb.score > 8 %}true{% endif %}"
      template: |
        {% if jobs[job_id].plugins.tmdb.movie %}⭐ HIGH RATED: {{ jobs[job_id].plugins.tmdb.movie.ratings.tmdb.score }}/10{% elif jobs[job_id].plugins.tmdb.show %}⭐ HIGH RATED: {{ jobs[job_id].plugins.tmdb.show.ratings.tmdb.score }}/10{% endif %}

    # Test count filter (works against jobs[job_id].plugins.<name> chains)
    - name: test_count
      type: print
      template: |
        {% if jobs[job_id].plugins.tmdb.movie %}Genres: {{ jobs[job_id].plugins.tmdb.movie.genres | count }} | Cast: {{ jobs[job_id].plugins.tmdb.movie.people.cast | count }}{% elif jobs[job_id].plugins.tmdb.show %}Genres: {{ jobs[job_id].plugins.tmdb.show.genres | count }} | Cast: {{ jobs[job_id].plugins.tmdb.show.people.cast | count }}{% if jobs[job_id].plugins.tmdb.show.episode_people %} | Guest Stars: {{ jobs[job_id].plugins.tmdb.show.episode_people.guest_stars | count }}{% endif %}{% endif %}

    # Test FFprobe (if available)
    - name: test_ffprobe
      type: print
      condition: "{% if jobs[job_id].plugins.ffprobe %}true{% endif %}"
      template: |
        📹 Video: {{ jobs[job_id].plugins.ffprobe.format.format_long_name }} | Duration: {{ jobs[job_id].plugins.ffprobe.format.duration }}s

    # Test missing data (should not error — ChainableUndefined renders to "")
    - name: test_missing
      type: print
      template: |
        Missing test: {{ jobs[job_id].plugins.nonexistent.field | default('N/A') }}

    # Summary
    - name: print_summary
      type: print
      template: |

        ============================================================
