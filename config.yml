# Session 12 Test Config
# Full integration test with real file

options:
  debug: true
  dry_run: true
  
scanner:
  enabled: true
  targets:
    - "/tmp/test_movies/The.Matrix.1999.1080p.mkv"
  allow_virtual_paths: false
  extensions: [mkv, mp4]
  recursive: false

renamer:
  enabled: true
  media_type: auto

tmdb:
  enabled: true
  api_key: "${TMDB_API_KEY}"
  language: en-US
  region: US

tasker:
  enabled: true
  dry_run: true
  tasks:
    - type: print
      template: "Movie: {{ job.input.value }}"
