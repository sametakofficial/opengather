# ============================================================
# Archiverr Configuration - Session 11 Format
# ============================================================
# FlexGet-style: Each plugin is a top-level key
# New terminology: run (execution), job (match)
# ============================================================

# Global options
options:
  debug: true
  dry_run: true
  hardlink: true
  memory:
    max_plugins_mb: 500
    flush_threshold: 0.8
    eviction_policy: completed_first

# Aliases - Define shortcuts for template access
# New terminology: run, job instead of execution, match
aliases:
  # System shortcuts
  r: "run" # {{ r.id }}, {{ r.success }}
  j: "job" # {{ j.index }}, {{ j.input.value }}

  # Plugin shortcuts (current job context)
  p: "job.plugins.renamer.parsed" # {{ p.movie.name }}
  movie: "job.plugins.renamer.parsed.movie"
  show: "job.plugins.renamer.parsed.show"

  # Metadata shortcuts
  m: "job.plugins.tmdb.movie" # {{ m.title }}
  s: "job.plugins.tmdb.show" # {{ s.name }}

  # Technical data
  video: "job.plugins.ffprobe.video"
  audio: "job.plugins.ffprobe.audio"

# ============================================================
# PLUGINS (FlexGet-style: each plugin is a top-level key)
# ============================================================

# INPUT STAGE: File discovery
scanner:
  enabled: true
  recursive: false
  targets:
    - /home/samet/torrents/Mr. & Mrs. Smith (2005) BluRay 1080p DDP5.1 H.265 TSRG.mkv

# PARSE STAGE: Filename parsing
renamer:
  enabled: true
  media_type: auto

# DATA STAGE: Metadata fetching
tmdb:
  enabled: true
  api_key: ${TMDB_API_KEY}
  language: tr-TR
  region: TR
  include-raw: true
  extras:
    movie_credits: true
    movie_images: true
    movie_keywords: true
    movie_videos: true
    tv_credits: true
    tv_episode_credits: true
    tv_episode_images: true
    tv_images: true
    tv_keywords: true
    tv_season_images: true
    tv_videos: true

ffprobe:
  enabled: true
  timeout: 15

# Disabled plugins
tvdb:
  enabled: false
  api_key: ${TVDB_API_KEY}

omdb:
  enabled: false
  api_key: ${OMDB_API_KEY}

tvmaze:
  enabled: false

file-reader:
  enabled: false

mock-test:
  enabled: false

# ============================================================
# OUTPUT STAGE: Task execution (replaces tasks: section)
# ============================================================
tasker:
  enabled: true
  provides:
    - fs.write:/srv/media
  tasks:
    # Print job info
    - name: print_job_header
      type: print
      template: |

        ========== JOB {{ index }} {{config.ffprobe.timeout}} ========== 

    # Print parsed info
    - name: print_parsed
      type: print
      template: |
        {% if p.movie %}MOVIE: {{ p.movie.name }} ({{ p.movie.year }}){% endif %}
        {% if p.show %}SHOW: {{ p.show.name }} S{{ '%02d' | format(p.show.season) }}E{{ '%02d' | format(p.show.episode) }}{% endif %}

    # Print metadata
    - name: print_metadata
      type: print
      template: |
        {% if m %}TMDb: {{ m.title.primary if m.title is mapping else m.title }} ({{ m.release.year if m.release is mapping else (m.release_date[:4] if m.release_date else 'N/A') }}){% endif %}
        {% if s %}TMDb Show: {{ s.name.primary if s.name is mapping else s.name }}{% endif %}

    # Save movie task (example)
    - name: save_movie
      type: save
      path: "{% if p.movie %}/srv/archive/{{ (m.title.primary if m.title is mapping else m.title) if m else p.movie.name }} ({{ (m.release.year if m.release is mapping else m.release_date[:4]) if m and (m.release or m.release_date) else p.movie.year }})/{{ (m.title.primary if m.title is mapping else m.title) if m else p.movie.name }}.mkv{% endif %}"

    # Save show task (example)
    - name: save_show
      type: save
      path: "{% if p.show %}/srv/archive/{{ s.name if s else p.show.name }}/Season {{ p.show.season }}/{{ s.name if s else p.show.name }} S{{ '%02d' | format(p.show.season) }}E{{ '%02d' | format(p.show.episode) }}.mkv{% endif %}"

    # External tasks - disabled for now (verbose output)
    # - name: detailed_metadata_check
    #   external: true
    #   path: tasks/metadata-checker.yml

    # - name: dump_api_response
    #   external: true
    #   path: tasks/api-response-dump.yml
